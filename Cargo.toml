[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
modula-crypto = { path = "crates/crypto" }
modula-proto = { path = "crates/proto" }
modula-node = { path = "crates/node" }

anyhow = "1"
async-trait = "0.1"
argon2 = { version = "0.6", features = ["zeroize"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
getrandom = "0.4"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
regex = "1"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
bollard = "0.21"
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "json", "uuid", "time"] }
subtle = "2"
thiserror = "2"
totp-rs = { version = "6", default-features = false, features = ["alloc"] }
hmac = "0.13"
data-encoding = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "limit", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
