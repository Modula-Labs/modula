[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
modula-crypto = { path = "crates/crypto" }
modula-proto = { path = "crates/proto" }
modula-id = { path = "crates/id" }
modula-node = { path = "crates/node" }
modula-backup = { path = "crates/backup" }
modula-cli = { path = "crates/cli" }
modula-hetzner = { path = "crates/hetzner" }

anyhow = "1"
# Backups: age encryption (x25519 recipients, streaming) and S3 request signing.
age = { version = "0.12", features = ["async"] }
bech32 = "0.11"
bytes = "1"
percent-encoding = "2"
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
async-trait = "0.1"
argon2 = { version = "0.6", features = ["zeroize"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures = "0.3"
hex = "0.4"
http = "1"
getrandom = "0.4"
globset = "0.4"
# `modula up`: walks a directory honoring .gitignore / .modulaignore.
ignore = "0.4"
# `modula server create`: the interactive wizard (selects with filtering, hidden input).
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
regex = "1"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# Release signatures (Ed25519) for update checks; already in the tree via rustls.
ring = "0.17"
# Update checks: release versions and the maintenance window's time zone.
semver = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser", "crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The CLI verifies TLS with the OS trust store (as reqwest already does).
rustls-platform-verifier = "0.7"
# WebSocket client for `modula connect`; TLS is ours (tokio-rustls, ring).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
x509-parser = "0.18"
bollard = "0.21"
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "json", "time"] }
subtle = "2"
thiserror = "2"
totp-rs = { version = "6", default-features = false, features = ["alloc"] }
hmac = "0.13"
# Custom domain verification: TXT/CNAME/A lookups against public resolvers.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
# The node's resolver for `<service>.modula.internal` (messages only).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
# Private networking: kernel WireGuard over netlink (modula-node, Linux only).
defguard_wireguard_rs = { version = "0.12", default-features = false }
# 9.x signs with ring (already in the tree); 10+ needs aws-lc or RustCrypto RSA.
jsonwebtoken = "9"
data-encoding = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
tokio-util = "0.7"
# The Database tab: the node talks to Postgres containers on their private network.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# SCRAM verifiers, so a new database password never travels in clear.
postgres-protocol = "0.6"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "limit", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Password hashing (argon2id, 64 MiB) is far too slow unoptimized: every
# test sign-in would take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
